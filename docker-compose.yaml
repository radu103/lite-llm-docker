# Docker Compose file for LiteLLM with PostgreSQL and Adminer
name: litellm-docker

services:

  # PostgreSQL database
  postgres:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres    
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data 
    networks:
      default:
        ipv4_address: 172.101.0.2
 
  # PgAdmin4 for PostgreSQL management
  pgadmin4:
    depends_on:
      - postgres
    image: dpage/pgadmin4:9.3.0
    ports:
      - 54321:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin4.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin4:/var/lib/pgadmin
    networks:
      default:
        ipv4_address: 172.101.0.3

  # LiteLLM proxy server for AI model serving
  lite-llm:
    depends_on:
      - postgres
    image: ghcr.io/berriai/litellm:main-latest
    networks:
      default:
        ipv4_address: 172.101.0.4
    ports:
      - 4000:4000
    environment:
      LITELLM_MASTER_KEY: sk-1234
      LITELLM_SALT_KEY: sk-XXXXXXXX
      DATABASE_URL: postgres://postgres:postgres@172.101.0.2:5432/litellm
      PORT: 4000
      STORE_MODEL_IN_DB: True
      UI_USERNAME: admin
      UI_PASSWORD: LiteLLM

  # Ollama for model serving
  ollama:
    restart: always
    image: ollama/ollama
    ports:
      - 11434:11434
    networks:
      default:
        ipv4_address: 172.101.0.5
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]      

  # n8n for workflow automation
  n8n:
    depends_on:
      - postgres
    image: n8nio/n8n
    ports:
      - 5678:5678
    networks:
      default:
        ipv4_address: 172.101.0.6      
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: 172.101.0.2
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: postgres
    volumes:
      - n8n_data:/home/node/.n8n

  # Docling for document processing
  docling:
    image: quay.io/docling-project/docling-serve
    ports:
      - 5001:5001
    environment:
      DOCLING_SERVE_ENABLE_UI: true
    networks:
      default:
        ipv4_address: 172.101.0.7

  # ChromaDB for vector database
  chromadb:
    image: chromadb/chroma:1.0.9.dev38
    ports:
      - 8000:8000
    environment:
      IS_PERSISTENT: true
      ANONYMIZED_TELEMETRY: true
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      default:
        ipv4_address: 172.101.0.8

  # AnythingLLM for Workspaces and LLM RAG with own documents
  anything-llm:
    image: mintplexlabs/anythingllm
    ports:
      - 3001:3001
    environment:
      STORAGE_DIR: /app/server/storage
      STORAGE_LOCATION: /app/server/storage
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://host.docker.internal:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: 8192
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://host.docker.internal:11434
      OLLAMA_MODEL_PREF: phi4:14b
      OLLAMA_MODEL_TOKEN_LIMIT: 16184
      VECTOR_DB : chroma
      CHROMA_ENDPOINT: http://172.101.0.8:8000
      CHROMA_API_HEADER: x-chroma-token
      CHROMA_API_KEY: x-chroma-token
    command: --cap-add SYS_ADMIN
    volumes:
      - anything_llm_storage:/app/server/storage
    networks:
      default:
        ipv4_address: 172.101.0.9

  ubuntu-faster-whisper:
    image: radu103/ubuntu-faster-whisper:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_BEAM=10               #optional, default is 5
      - WHISPER_LANG=ro               #optional
      - POSTGRES_HOST=172.101.0.2
      - POSTGRES_PORT=5432
      - POSTGRES_DB=whisper
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres      
      - DEFAULT_ADMIN_USERNAME=radu
      - DEFAULT_ADMIN_PASSWORD=b9043bd0049b74088b8b27d1a874e1b93a1e8db3516e317847c63c2059098c89
      - DEFAULT_API_KEY=8c0b1f2a-3d4e-4b5f-8c7d-9a2e6f3b5c1e      
    volumes:
      - faster_whisper_audio:/app/audio
      - faster_whisper_output:/app/output
      - faster_whisper_storage:/root/.cache
    ports:
      - 10301:10301
    networks:
      default:
        ipv4_address: 172.101.0.10
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.101.0.0/24

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/pgdata
      o: bind
  pgadmin4:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/pgadmin4
      o: bind
  ollama:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/ollama
      o: bind
  n8n_data:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/n8n_data
      o: bind
  chroma_data:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/chroma_data
      o: bind
  anything_llm_storage:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/anything_llm_storage
      o: bind
  faster_whisper_audio:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/faster_whisper_audio
      o: bind
  faster_whisper_output:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/faster_whisper_output
      o: bind
  faster_whisper_storage:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/faster_whisper_storage
      o: bind