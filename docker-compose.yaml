      device: R:/lite-llm-docker/pgadmin4
      o: bind   
  ollama_models:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/ollama
      o: bind
  node_red_data:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/node_red_data
      o: bind
  node_red_unsorted_audio:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/node_red_unsorted_audio
      o: bind
  node_red_imported_audio:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/node_red_imported_audio
      o: bind
  node_red_unsorted_doc:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/node_red_unsorted_doc
      o: bind
  node_red_imported_doc:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/node_red_imported_doc
      o: bind      
  chroma_data:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/chroma_data
      o: bind
  anything_llm_storage:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/anything_llm_storage
      o: bind
  faster_whisper_audio:
    driver: local
