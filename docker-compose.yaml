# Docker Compose file for LiteLLM with PostgreSQL and Adminer
name: litellm-docker

services:

  # PostgreSQL database
  postgres:
    image: postgres
    networks:
      default:
        ipv4_address: 172.101.0.2  
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres    
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data 
 
  # PgAdmin4 for PostgreSQL management
  pgadmin4:
    depends_on:
      - postgres
    image: dpage/pgadmin4:9.3.0
    networks:
      default:
        ipv4_address: 172.101.0.3    
    ports:
      - 54321:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin4.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin4:/var/lib/pgadmin

  # LiteLLM proxy server for AI model serving
  lite-llm:
    depends_on:
      - postgres
    image: ghcr.io/berriai/litellm:main-latest
    networks:
      default:
        ipv4_address: 172.101.0.4
    ports:
      - 4000:4000
    environment:
      LITELLM_MASTER_KEY: sk-1234
      LITELLM_SALT_KEY: sk-XXXXXXXX
      DATABASE_URL: postgres://postgres:postgres@172.101.0.2:5432/litellm
      PORT: 4000
      STORE_MODEL_IN_DB: True
      UI_USERNAME: admin
      UI_PASSWORD: LiteLLM

  # Ollama for model serving
  ollama-auth:
    image: radu103/ollama-auth:latest
    networks:
      default:
        ipv4_address: 172.101.0.5  
    ports:
      - "11435:80"
    environment:
      - OLLAMA_API_KEY=ea8fbe0097004010dd91a7baa8f60f23f3a239000f5aabc7b85c7d31c5b06b75
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  # n8n for workflow automation
  node-red:
    depends_on:
      - docling
      - ubuntu-faster-whisper
    image: nodered/node-red
    networks:
      default:
        ipv4_address: 172.101.0.6    
    ports:
      - 1880:1880
    volumes:
      - node_red_data:/data
      - node_red_unsorted_audio:/data/unsorted_audio
      - node_red_imported_audio:/data/imported_audio
      - node_red_unsorted_doc:/data/unsorted_doc
      - node_red_imported_doc:/data/imported_doc
      - faster_whisper_output:/data/output_audio
      - docling_output:/data/output_doc

  # Docling for document processing
  docling:
    image: quay.io/docling-project/docling-serve
    networks:
      default:
        ipv4_address: 172.101.0.7    
    ports:
      - 5001:5001
    environment:
      DOCLING_SERVE_ENABLE_UI: true
      DOCLING_SERVE_MAX_SYNC_WAIT: 600

  # ChromaDB for vector database
  chromadb:
    image: chromadb/chroma:1.0.9.dev38
    networks:
      default:
        ipv4_address: 172.101.0.8    
    ports:
      - 8000:8000
    environment:
      IS_PERSISTENT: true
      ANONYMIZED_TELEMETRY: true
    volumes:
      - chroma_data:/chroma/chroma

  # AnythingLLM for Workspaces and LLM RAG with own documents
  anything-llm:
    depends_on:
      - postgres
      - chromadb
    image: mintplexlabs/anythingllm
    networks:
      default:
        ipv4_address: 172.101.0.9    
    ports:
      - 3001:3001
    environment:
      STORAGE_DIR: /app/server/storage
      STORAGE_LOCATION: /app/server/storage
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://host.docker.internal:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: 8192
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://host.docker.internal:11434
      OLLAMA_MODEL_PREF: phi4:14b
      OLLAMA_MODEL_TOKEN_LIMIT: 16184
      VECTOR_DB : chroma
      CHROMA_ENDPOINT: http://172.101.0.8:8000
      CHROMA_API_HEADER: x-chroma-token
      CHROMA_API_KEY: x-chroma-token
    command: --cap-add SYS_ADMIN
    volumes:
      - anything_llm_storage:/app/server/storage

  ubuntu-faster-whisper:
    depends_on:
      - postgres
    image: radu103/ubuntu-faster-whisper:latest
    networks:
      default:
        ipv4_address: 172.101.0.10
    ports:
      - 10301:10301    
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_BEAM=10               #optional, default is 5
      - WHISPER_LANG=ro               #optional
      - POSTGRES_HOST=172.101.0.2
      - POSTGRES_PORT=5432
      - POSTGRES_DB=whisper
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres      
      - DEFAULT_ADMIN_USERNAME=radu
      - DEFAULT_ADMIN_PASSWORD=b9043bd0049b74088b8b27d1a874e1b93a1e8db3516e317847c63c2059098c89
      - DEFAULT_API_KEY=8c0b1f2a-3d4e-4b5f-8c7d-9a2e6f3b5c1e      
    volumes:
      - faster_whisper_audio:/app/audio
      - faster_whisper_output:/app/output
      - faster_whisper_storage:/root/.cache

    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.101.0.0/24

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/pgdata
      o: bind
  pgadmin4:
