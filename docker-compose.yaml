      o: bind
  faster_whisper_output:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/faster_whisper_output
      o: bind
  faster_whisper_storage:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/faster_whisper_storage
      o: bind
  docling_output:
    driver: local
    driver_opts:
      type: none
      device: R:/lite-llm-docker/docling_output
      o: bind